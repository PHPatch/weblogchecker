[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weblogchecker"
version = "0.2.2"
description = "Free access-log compromise analyzer: reads Apache/nginx logs you own and reports webshell interactions, exploitation patterns and brute-force bursts - with severity, confidence and remediation. Read-only, no network."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Superstar Telecom LLC" }]

[project.scripts]
weblogchecker = "weblogchecker.__main__:cli"

[tool.setuptools]
packages = ["weblogchecker"]

[tool.setuptools.package-data]
weblogchecker = ["data/*.json"]
